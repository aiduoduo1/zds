[versions]
agp = "8.7.3"
kotlin = "2.0.21"

coreKtx = "1.15.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.8.0"
fragment = "1.5.4"
lifecycle = "2.6.2"
recyclerview = "1.3.2"
swiperefreshlayout = "1.1.0"
coil = "2.7.0"
chucker = "4.1.0"

retrofit = "2.11.0"
okhttp = "4.12.0"
gson = "2.11.0"


datastore = "1.2.1"
mmkv = "2.4.0"

junit = "4.13.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"



[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
android-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
coil-core = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
chucker-library = { group = "com.github.chuckerteam.chucker", name = "library", version.ref = "chucker" }
chucker-library-no-op = { group = "com.github.chuckerteam.chucker", name = "library-no-op", version.ref = "chucker" }

retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
